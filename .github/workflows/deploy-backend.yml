
name: Deploy Woofskis Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woofskis-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Configure and Validate SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu

          echo "Checking required secrets..."
          test -n "$EC2_HOST" || { echo "ERROR: EC2_HOST is empty"; exit 1; }
          test -n "$EC2_USER" || { echo "ERROR: EC2_USER is empty"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "ERROR: EC2_SSH_KEY is empty"; exit 1; }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/woofskis_ec2
          chmod 600 ~/.ssh/woofskis_ec2

          echo "Validating private key..."
          ssh-keygen -y -f ~/.ssh/woofskis_ec2 > /dev/null

          echo "Checking SSH host connectivity..."
          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "SSH configuration completed."

      - name: Test SSH Authentication
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/woofskis_ec2 \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" \
            'echo "SSH authentication successful"'

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/woofskis_ec2 \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" \
            'bash -se' <<'REMOTE'
              set -eu

              cd /tmp/woofskis-repo
              git pull --ff-only origin main

              sudo cp -a backend/. /var/www/woofskis/app/
              sudo chown -R ubuntu:ubuntu /var/www/woofskis/app

              cd /var/www/woofskis/app
              npm ci
              npm run build

              pm2 restart woofskis-api
              pm2 save

              for i in $(seq 1 12); do
                if curl --fail --silent \
                  http://127.0.0.1:5000/api/v1/health; then
                  echo "Health check passed"
                  exit 0
                fi
                sleep 5
              done

              echo "ERROR: Backend health check failed"
              pm2 logs woofskis-api --lines 50 --nostream
              exit 1
          REMOTE

      - name: Verify public HTTPS API
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            https://api.woofskis.com/api/v1/health
