name: Deploy Woofskis Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: woofskis-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Inspect GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log(JSON.stringify({
              iss: payload.iss,
              aud: payload.aud,
              sub: payload.sub,
              repository: payload.repository,
              ref: payload.ref
            }, null, 2));

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::449112696823:role/WoofskisGitHubDeployRole
          aws-region: us-east-2
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy through SSM
        run: |
          set -eu

          INSTANCE_ID="i-022a5944c5fd2092e"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Woofskis backend from GitHub Actions" \
            --parameters 'commands=[
              "set -eu",
              "git config --global --add safe.directory /tmp/woofskis-repo",
              "cd /tmp/woofskis-repo",
              "git pull --ff-only origin main",
              "sudo cp -a backend/. /var/www/woofskis/app/",
              "sudo chown -R ubuntu:ubuntu /var/www/woofskis/app",
              "cd /var/www/woofskis/app",
              "npm ci",
              "npm run build",
              "pm2 restart woofskis-api",
              "pm2 save",
              "for i in $(seq 1 12); do if curl --fail --silent http://127.0.0.1:5000/api/v1/health; then echo HEALTH_CHECK_PASSED; exit 0; fi; sleep 5; done",
              "echo HEALTH_CHECK_FAILED",
              "pm2 logs woofskis-api --lines 50 --nostream",
              "exit 1"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo Pending)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "ERROR: Timed out waiting for SSM deployment"
          exit 1

      - name: Verify public HTTPS API
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            https://api.woofskis.com/api/v1/health
