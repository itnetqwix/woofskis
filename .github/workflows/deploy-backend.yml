
name: Deploy Woofskis Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: woofskis-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::449112696823:role/WoofskisGitHubDeployRole
          aws-region: us-east-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy through SSM
        shell: bash
        env:
          INSTANCE_ID: i-022a5944c5fd2092e
        run: |
          set -euo pipefail

          cat > deploy.sh <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail

          cd /tmp/woofskis-repo
          git pull --ff-only origin main

          sudo cp -a backend/. /var/www/woofskis/app/
          sudo chown -R ubuntu:ubuntu /var/www/woofskis/app

          sudo -u ubuntu -H bash -lc '
            set -e
            cd /var/www/woofskis/app
            npm ci
            npm run build
            pm2 restart woofskis-api
            pm2 save
          '

          for i in $(seq 1 12); do
            if curl --fail --silent http://127.0.0.1:5000/api/v1/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done

          echo "ERROR: Backend health check failed"
          sudo -u ubuntu -H pm2 logs woofskis-api --lines 50 --nostream || true
          exit 1
          SCRIPT

          PAYLOAD=$(base64 -w 0 deploy.sh)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Woofskis backend from GitHub Actions" \
            --parameters "{\"commands\":[\"echo '$PAYLOAD' | base64 -d > /tmp/woofskis-deploy.sh && bash /tmp/woofskis-deploy.sh\"]}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '[Status,StandardErrorContent,StandardOutputContent]' \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "ERROR: Timed out waiting for SSM deployment"
          exit 1

      - name: Verify public HTTPS API
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            https://api.woofskis.com/api/v1/health
